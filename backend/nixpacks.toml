[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "apt-get update -qq",
  "apt-get install -y -qq libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libatspi2.0-0 libxshmfence1 libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libgtk-3-0 libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxext6 libxi6 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator3-1 xdg-utils",
  "apt-get install -y -qq libasound2 || apt-get install -y -qq libasound2-data || echo '⚠️ libasound2 não disponível, continuando sem áudio...'",
  "npm install --production=false"
]

[start]
cmd = "node server.js"

